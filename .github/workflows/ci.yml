name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Commands below use only checked-in paths and runner-provided tool locations.
# No issue, pull request, commit, or ref text is interpolated into shell commands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-headless:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    outputs:
      result: ${{ steps.regression.outputs.result }}

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install runtime dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      # Trusted ephemeral macos-14 job only; never a local maintenance command.
      - name: Prepare owned CI Homebrew directory modes
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_ci_owned_homebrew.py
          python3 -I -S -B test/test_omp_ci_owned_homebrew_errors.py
          python3 -I -S -B test/omp-ci-owned-homebrew.py

      - name: Verify source-bound jq proof and current host branch
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_jq_ci_proof.py
          python3 -I -S -B test/omp-jq-ci-proof.py

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash_bin="$(brew --prefix)/bin/bash"
          for file in install.sh bin/*.sh test/*.sh; do
            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" == *zsh* ]]; then
              /bin/zsh -n "$file"
            else
              "$bash_bin" -n "$file"
            fi
          done
          /bin/zsh -n bin/aliases.zsh

      - name: Lint public documentation
        run: npx --yes markdownlint-cli2@latest README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/*.md' '.github/*.md'

      - name: Run regression suite
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/ci-headless.json"
          BASH_BIN="$(brew --prefix)/bin/bash" ZSH_BIN=/bin/zsh ./test/run-all.sh --ci-group headless --ci-result "$result"
          printf 'result=%s\n' "$(cat "$result")" >> "$GITHUB_OUTPUT"

  regression-shell:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    outputs:
      result: ${{ steps.regression.outputs.result }}

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install runtime dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      # Trusted ephemeral macos-14 job only; never a local maintenance command.
      - name: Prepare owned CI Homebrew directory modes
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_ci_owned_homebrew.py
          python3 -I -S -B test/test_omp_ci_owned_homebrew_errors.py
          python3 -I -S -B test/omp-ci-owned-homebrew.py

      - name: Verify source-bound jq proof and current host branch
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_jq_ci_proof.py
          python3 -I -S -B test/omp-jq-ci-proof.py

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash_bin="$(brew --prefix)/bin/bash"
          for file in install.sh bin/*.sh test/*.sh; do
            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" == *zsh* ]]; then
              /bin/zsh -n "$file"
            else
              "$bash_bin" -n "$file"
            fi
          done
          /bin/zsh -n bin/aliases.zsh

      - name: Lint public documentation
        run: npx --yes markdownlint-cli2@latest README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/*.md' '.github/*.md'

      - name: Run regression suite
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/ci-shell.json"
          BASH_BIN="$(brew --prefix)/bin/bash" ZSH_BIN=/bin/zsh ./test/run-all.sh --ci-group shell --ci-result "$result"
          printf 'result=%s\n' "$(cat "$result")" >> "$GITHUB_OUTPUT"

  regression-preservation:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    outputs:
      result: ${{ steps.regression.outputs.result }}

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install runtime dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      # Trusted ephemeral macos-14 job only; never a local maintenance command.
      - name: Prepare owned CI Homebrew directory modes
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_ci_owned_homebrew.py
          python3 -I -S -B test/test_omp_ci_owned_homebrew_errors.py
          python3 -I -S -B test/omp-ci-owned-homebrew.py

      - name: Verify source-bound jq proof and current host branch
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_jq_ci_proof.py
          python3 -I -S -B test/omp-jq-ci-proof.py

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash_bin="$(brew --prefix)/bin/bash"
          for file in install.sh bin/*.sh test/*.sh; do
            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" == *zsh* ]]; then
              /bin/zsh -n "$file"
            else
              "$bash_bin" -n "$file"
            fi
          done
          /bin/zsh -n bin/aliases.zsh

      - name: Lint public documentation
        run: npx --yes markdownlint-cli2@latest README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/*.md' '.github/*.md'

      - name: Run regression suite
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/ci-preservation.json"
          BASH_BIN="$(brew --prefix)/bin/bash" ZSH_BIN=/bin/zsh ./test/run-all.sh --ci-group preservation --ci-result "$result"
          printf 'result=%s\n' "$(cat "$result")" >> "$GITHUB_OUTPUT"

  regression-python:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    outputs:
      result: ${{ steps.regression.outputs.result }}

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install runtime dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      # Trusted ephemeral macos-14 job only; never a local maintenance command.
      - name: Prepare owned CI Homebrew directory modes
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_ci_owned_homebrew.py
          python3 -I -S -B test/test_omp_ci_owned_homebrew_errors.py
          python3 -I -S -B test/omp-ci-owned-homebrew.py

      - name: Verify source-bound jq proof and current host branch
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_jq_ci_proof.py
          python3 -I -S -B test/omp-jq-ci-proof.py

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash_bin="$(brew --prefix)/bin/bash"
          for file in install.sh bin/*.sh test/*.sh; do
            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" == *zsh* ]]; then
              /bin/zsh -n "$file"
            else
              "$bash_bin" -n "$file"
            fi
          done
          /bin/zsh -n bin/aliases.zsh

      - name: Lint public documentation
        run: npx --yes markdownlint-cli2@latest README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/*.md' '.github/*.md'

      - name: Run regression suite
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/ci-python.json"
          BASH_BIN="$(brew --prefix)/bin/bash" ZSH_BIN=/bin/zsh ./test/run-all.sh --ci-group python --ci-result "$result"
          printf 'result=%s\n' "$(cat "$result")" >> "$GITHUB_OUTPUT"

  test:
    if: ${{ always() }}
    needs: [regression-headless, regression-shell, regression-preservation, regression-python]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install verifier Python
        run: |
          brew install python@3.13
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      - name: Verify complete regression results
        env:
          CI_STATUS_HEADLESS: ${{ needs.regression-headless.result }}
          CI_STATUS_SHELL: ${{ needs.regression-shell.result }}
          CI_STATUS_PRESERVATION: ${{ needs.regression-preservation.result }}
          CI_STATUS_PYTHON: ${{ needs.regression-python.result }}
          CI_RESULT_HEADLESS: ${{ needs.regression-headless.outputs.result }}
          CI_RESULT_SHELL: ${{ needs.regression-shell.outputs.result }}
          CI_RESULT_PRESERVATION: ${{ needs.regression-preservation.outputs.result }}
          CI_RESULT_PYTHON: ${{ needs.regression-python.outputs.result }}
        run: |
          set -euo pipefail
          [[ "$CI_STATUS_HEADLESS" == success ]] || exit 1
          [[ "$CI_STATUS_SHELL" == success ]] || exit 1
          [[ "$CI_STATUS_PRESERVATION" == success ]] || exit 1
          [[ "$CI_STATUS_PYTHON" == success ]] || exit 1
          ./test/run-all.sh --ci-verify


  # Temporary evidence capture for the changed P1 source closure. This never
  # substitutes for the four regression jobs or the required aggregate.
  jq-p1-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out current source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install runtime dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"
      - name: Prepare owned CI Homebrew directory modes
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_ci_owned_homebrew.py
          python3 -I -S -B test/test_omp_ci_owned_homebrew_errors.py
          python3 -I -S -B test/omp-ci-owned-homebrew.py
      - name: Capture actual non-system jq source evidence
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY_CAPTURE'
          import hashlib, importlib.util, json, os, stat, subprocess
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('proof', root/'test/omp-jq-ci-proof.py')
          proof = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(proof)
          def source_pins():
              pins = []
              for pin in json.loads((root/'test/fixtures/omp-jq-v1-093-evidence.json').read_bytes())['source_pins']:
                  path = root/pin['path']
                  info = path.lstat()
                  assert stat.S_ISREG(info.st_mode)
                  body = path.read_bytes()
                  pins.append({'path': pin['path'], 'bytes': len(body),
                               'mode': f'{stat.S_IMODE(info.st_mode):04o}',
                               'sha256': hashlib.sha256(body).hexdigest()})
              return pins
          pins = source_pins()
          ordinary, branch = proof.inspect(root, False, subprocess.run)
          strict, strict_branch = proof.inspect(root, True, subprocess.run)
          assert branch == strict_branch == 'NON_SYSTEM'
          assert all(ordinary[key] == strict[key] for key in
                     ('selected', 'physical', 'physical_parent', 'system_jq', 'non_system_physical_proof'))
          assert pins == source_pins()
          observation = {key: strict[key] for key in sorted(proof.HISTORICAL_KEYS)}
          assert proof.validate_observation(observation, historical=True) == 'NON_SYSTEM'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {'head': head, 'source_pins': pins}
          print('JQ_P1_EVIDENCE ' + json.dumps({'schema': 'jq-evidence-capture/v1',
              **receipt, 'observation': observation,
              'source_receipt_sha256': hashlib.sha256(json.dumps(receipt,
                  sort_keys=True, separators=(',', ':')).encode()).hexdigest()},
              sort_keys=True, separators=(',', ':')), flush=True)
          PY_CAPTURE
